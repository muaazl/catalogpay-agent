[project]
name = "catalogpay-agent-backend"
version = "1.0.0"
description = "CatalogPay Agent: messy buyer orders -> SKU-verified PayPal Orders with multi-vendor split payouts."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "rapidfuzz==3.14.6",
    "numpy==2.5.4",
    "httpx==0.28.1",
    "google-genai==2.33.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
]
# Only for regenerating samples/ (scripts/generate_samples.py); never needed at runtime.
samples = [
    "pillow==13.0.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
# Two known third-party deprecations we cannot fix in our code. Matched on exact message
# text so any *new* warning (including from our code) still surfaces.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:'_UnionGenericAlias' is deprecated and slated for removal:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
